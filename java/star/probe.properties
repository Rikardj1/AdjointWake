# AdjointProbe (phase 0) settings. All optional; these are the defaults.
diameter = 1.0
speed = 2.0
density = 998.0
viscosity = 1.0e-3
# mesh: base cell and refined cell between the blob and the cost slab, in D
base_size_D = 0.1
fine_size_D = 0.02
coupled_cfl = 20
# force blob: Gaussian centred at (blob_x_D, blob_y_D, 0)*D, amplitude in rho U^2 / D
blob_x_D = -1.0
blob_y_D = 0.25
blob_sigma_D = 0.1
blob_amplitude_nd = -0.5
# cost slab at x = 0
cost_slab_thickness_D = 0.04
cost_radius_D = 0.6
# solves
primal_iterations = 3000
primal_tolerance = 1.0e-6
adjoint_iterations = 2000
fd_relative_step = 0.02
# field functions whose name matches are treated as adjoint fields
adjoint_ff_regex = (?i).*adjoint.*
# table lookup used by cost B
table_lookup = interpolatePositionTable(@Table("ProbeTarget"), "utx")
