# Example case for examples/WakeEdStar.csv
# Read by both the STAR-CCM+ macro and python -m wakegen.

# --- flow and geometry (SI) ---
# The wake table's rings are at r = 0.1655 ... 0.543 m. With D = 0.944 m they
# are r/R = 0.35, 0.50, 0.65, 0.85, 1.00, 1.15.
diameter = 0.944
# PLACEHOLDER: set the real ship speed.
ship_speed = 5.0
density = 998.0
hub_ratio = 0.2
prop_plane_x = 0.0
force_plane_x_D = -1.0

# --- target wake: X,Y,Z,Vx,Vy,Vz, coordinates in metres, velocities as V/Vs ---
wake_file = WakeEdStar.csv
wake_coord_scale = 1.0
wake_velocity_normalised = true
wake_interp = pchip

# --- force disk ---
ctrl_n_r = 24
ctrl_n_theta = 72
ctrl_r_min_R = 0.10
ctrl_r_max_R = 1.30
ctrl_edge_taper_R = 0.15
ctrl_sigma_D = 0.03

# --- cost function ---
cost_slab_thickness_D = 0.02
weight_axial = 1.0
weight_tangential = 1.0
weight_radial = 1.0

# inlet: the disk-mean cross-flow of the target is set by the inflow direction
crossflow = inlet

# --- optimiser ---
reg_alpha = 1.0e-5
reg_beta = 1.0e-4
max_iterations = 40

# --- adjoint field -> dJ/d(force density); fixed by the phase-0 check ---
adjoint_scale = 1.0
adjoint_times_volume = true
adjoint_column = .*adjoint.*
