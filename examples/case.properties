# Example case for examples/WakeEdStar.csv
# Read by both the STAR-CCM+ macro and python -m wakegen.

# --- flow and geometry (SI) ---
# WakeEdStar.csv is for D = 1.0 m (wake_diameter below), so its rings are at
# r/R = 0.33 ... 1.09 whatever diameter is set here.
diameter = 0.944
# PLACEHOLDER: set the real ship speed.
ship_speed = 5.0
density = 998.0
hub_ratio = 0.2
prop_plane_x = 0.0
force_plane_x_D = -1.0

# --- target wake: X,Y,Z,Vx,Vy,Vz, velocities as V/Vs ---
wake_file = WakeEdStar.csv
# Diameter the file's coordinates belong to [m]. WakeEdStar.csv is for D = 1.0 m,
# so its coordinates are scaled by diameter / wake_diameter to the propeller above.
# 0 = the coordinates are already in metres.
wake_diameter = 1.0
# Extra factor on the coordinates (e.g. 0.001 for a file in mm with wake_diameter = 0).
wake_coord_scale = 1.0
wake_velocity_normalised = true
wake_interp = pchip

# --- force disk ---
ctrl_n_r = 24
ctrl_n_theta = 72
ctrl_r_min_R = 0.10
ctrl_r_max_R = 1.30
ctrl_edge_taper_R = 0.15
ctrl_sigma_D = 0.03

# --- cost function ---
cost_slab_thickness_D = 0.02
weight_axial = 1.0
weight_tangential = 1.0
weight_radial = 1.0

# inlet: the disk-mean cross-flow of the target is set by the inflow direction
crossflow = inlet

# --- optimiser ---
reg_alpha = 1.0e-5
reg_beta = 1.0e-4
max_iterations = 40

# --- adjoint field -> dJ/d(force density) ---
# Phase 0 (AdjointProbe, STAR 21.04.008, coupled flow + SST frozen turbulence, 2026-11-19):
# finite difference / volume integral of VelocityAdjoint = 1.0006, so scale 1 and times volume.
adjoint_scale = 1.0
adjoint_times_volume = true
# STAR names the field Adjoint<n>::VelocityAdjoint (n = cost function); CoordSensitivity also contains "adjoint"
adjoint_column = .*velocityadjoint

# --- CalibrateWake.java only (STAR-CCM+ macro); python -m wakegen ignores these ---
# Python that runs wakegen, and the folder with the wakegen package (empty if pip-installed).
# Give the full path: inside STAR, plain "python" is STAR's own Python, which has no numpy.
# Backslashes and quotes are fine, e.g. python = C:\Users\me\AppData\Local\Programs\Python\Python312\python.exe
python = python
wakegen_path =
# domain around the propeller plane, in D; side_boundary = symmetry | inlet
domain_inlet_D = -4.0
domain_outlet_D = 4.0
domain_radius_D = 3.0
side_boundary = symmetry
base_size_D = 0.1
fine_size_D = 0.02
coupled_cfl = 20
viscosity = 1.0e-3
# flow solve: stop when J changes less than primal_tolerance (relative) for primal_stable_blocks blocks in a row
primal_min_iterations = 300
primal_max_iterations = 3000
primal_block = 50
primal_tolerance = 1.0e-5
primal_stable_blocks = 3
adjoint_iterations = 1000
max_solves = 200
