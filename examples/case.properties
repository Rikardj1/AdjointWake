# Example case for examples/WakeEdStar.csv
# Read by both the STAR-CCM+ macro and python -m wakegen.

# --- flow and geometry (SI) ---
# Full scale: D = 6.0 m, Vs = 24 knots = 12.3467 m/s.
diameter = 6.0
ship_speed = 12.3467
density = 998.0
hub_ratio = 0.2
prop_plane_x = 0.0
force_plane_x_D = -1.0

# --- target wake: X,Y,Z,Vx,Vy,Vz ---
# The file's coordinates are made non-dimensional with a diameter of 1.0 m
# (rings at r/R = 0.331, 0.472, 0.614, 0.803, 0.944, 1.086), so they are scaled
# by the real diameter. Velocities are V/Vs.
wake_file = WakeEdStar.csv
wake_coord_scale = 6.0
wake_velocity_normalised = true
wake_interp = pchip

# --- force disk ---
ctrl_n_r = 24
ctrl_n_theta = 72
ctrl_r_min_R = 0.10
ctrl_r_max_R = 1.30
ctrl_edge_taper_R = 0.15
ctrl_sigma_D = 0.03

# --- cost function ---
cost_slab_thickness_D = 0.02
weight_axial = 1.0
weight_tangential = 1.0
weight_radial = 1.0

# inlet: the disk-mean cross-flow of the target is set by the inflow direction
crossflow = inlet

# --- optimiser ---
reg_alpha = 1.0e-5
reg_beta = 1.0e-4
max_iterations = 40

# --- adjoint field -> dJ/d(force density); fixed by the phase-0 check ---
adjoint_scale = 1.0
adjoint_times_volume = true
adjoint_column = .*adjoint.*
